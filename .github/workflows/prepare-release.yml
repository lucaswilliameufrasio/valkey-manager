name: Prepare Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release (e.g. 0.1.1 or v0.1.1)
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-prep-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout full history
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0

      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libasound2-dev \
            libgl1-mesa-dev \
            libwayland-dev \
            libx11-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            pkg-config

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
        with:
          toolchain: stable

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2

      - name: Install git-cliff
        uses: taiki-e/install-action@fd2f5e3d644b484055ebf4268f474c565f148f25 # v2
        with:
          tool: git-cliff@2.13.1

      - name: Validate version
        id: version
        env:
          VERSION_INPUT: ${{ inputs.version }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import os
          import re
          import subprocess
          from pathlib import Path

          requested = os.environ["VERSION_INPUT"].removeprefix("v")
          if not re.fullmatch(r"\d+\.\d+\.\d+", requested):
              raise SystemExit("version must use semver format, e.g. 0.1.1")

          manifest = Path("src-tauri/Cargo.toml").read_text()
          match = re.search(r'(?m)^version = "([^"]+)"$', manifest)
          if match is None:
              raise SystemExit("could not read current package version")
          current = tuple(int(part) for part in match.group(1).split("."))
          requested_parts = tuple(int(part) for part in requested.split("."))
          if requested_parts < current:
              raise SystemExit("release version cannot be lower than the manifest version")

          tag = subprocess.run(
              ["git", "tag", "--list", f"v{requested}"],
              check=True,
              capture_output=True,
              text=True,
          ).stdout.strip()
          if tag:
              raise SystemExit(f"release tag v{requested} already exists")

          print(f"version={requested}")
          PY

      - name: Update version and changelog
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          path = Path("src-tauri/Cargo.toml")
          manifest = path.read_text()
          updated, count = re.subn(
              r'(?m)^version = "[^\"]+"$',
              f'version = "{os.environ["VERSION"]}"',
              manifest,
              count=1,
          )
          if count != 1:
              raise SystemExit("could not update package version")
          path.write_text(updated)
          PY
          git cliff --bump --tag "v$VERSION" -o CHANGELOG.md
          cargo check --workspace

      - name: Create release preparation PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          BRANCH: release/v${{ steps.version.outputs.version }}-rc.${{ github.run_attempt }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md Cargo.lock src-tauri/Cargo.toml
          git commit -m "chore(release): prepare for v$VERSION"
          git push origin HEAD:"$BRANCH"

          cat > "$RUNNER_TEMP/release-pr.md" <<EOF
          Automated release preparation for **v$VERSION**.

          After this PR is merged to main, create and push the release tag v$VERSION.
          The Release workflow will build Linux and macOS artifacts and publish the GitHub Release.
          EOF

          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "Release v$VERSION" \
            --body-file "$RUNNER_TEMP/release-pr.md"
